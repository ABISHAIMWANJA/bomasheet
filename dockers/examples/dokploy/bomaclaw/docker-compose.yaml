# BomaClaw — deployed as its own Dokploy service, independent of BomaSheet's
# own build and release lifecycle. Long-polls Telegram, so no domain, TLS, or
# published port is needed.

services:
  bomaclaw:
    build:
      context: ../../..
      dockerfile: apps/telegram-bot/Dockerfile
    restart: always
    volumes:
      - bomaclaw-data:/app/data:rw
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - BOMASHEET_ORIGIN=${BOMASHEET_ORIGIN}
      - BOMACLAW_ENCRYPTION_KEY=${BOMACLAW_ENCRYPTION_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_API_ENDPOINT=${OPENAI_API_ENDPOINT:-https://api.openai.com}
      - AI_FIELD_MODEL=${AI_FIELD_MODEL:-gpt-3.5-turbo}
      - BOMACLAW_DB_PATH=/app/data/bomaclaw.sqlite

volumes:
  bomaclaw-data: {}
